name: eastmarkhk_snowball
description: "EastmarkHK Snowball — compound interest calculator."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  intl: ^0.20.2
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.3
  http: ^1.4.0
  url_launcher: ^6.3.1
  country_flags: ^4.1.2
  pdf: ^3.13.0
  printing: ^5.15.0
  path_provider: ^2.1.5
  path: ^1.9.0
  flutter_native_splash: ^2.4.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/logo_full.png
    - assets/splash_mobile.png
    - assets/splash_desktop.png

# Native iOS/Android launch screen: brand green + diamond mark. The designed
# splash_mobile / splash_desktop artwork is shown by Flutter for 3 seconds
# (see lib/widgets/splash_background.dart) — Android cannot use the full
# 3040px splash as a drawable, which previously generated blank 1×1 images.
flutter_native_splash:
  color: "#0B6E4F"
  image: assets/logo_full.png
  android_12:
    image: assets/logo_full.png
    icon_background_color: "#0B6E4F"
    color: "#0B6E4F"
  web: false
