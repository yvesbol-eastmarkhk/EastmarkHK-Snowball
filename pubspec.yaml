name: eastmarkhk_snowball
description: "EastmarkHK Snowball — dual-currency client growth reports."
publish_to: "none"
version: 1.0.0+3

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  intl: ^0.20.2
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.3
  http: ^1.4.0
  url_launcher: ^6.3.1
  country_flags: ^4.1.2
  pdf: ^3.13.0
  printing: ^5.15.0
  path_provider: ^2.1.5
  path: ^1.9.0
  flutter_native_splash: ^2.4.6
  package_info_plus: ^10.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  msix: ^3.18.0

# Microsoft Store / sideload MSIX (build on Windows only).
# Store:     powershell -ExecutionPolicy Bypass -File tool\build_msix.ps1 -Store
# Sideload:  powershell -ExecutionPolicy Bypass -File tool\build_msix.ps1
# Partner Center: Store ID 9N1HX1C468PB
# PFN: EastmarkHK.EastmarkHKSnowball_rz3rjabnhm45p
# Store revision (4th digit) must stay 0 — e.g. 1.0.0.0 not 1.0.0.3.
msix_config:
  display_name: EastmarkHK Snowball
  publisher_display_name: EastmarkHK
  identity_name: EastmarkHK.EastmarkHKSnowball
  publisher: CN=212682DE-ED59-450E-8549-6B3A3B441865
  msix_version: 1.0.0.0
  logo_path: assets/logo_full.png
  capabilities: internetClient
  languages: en-us
  output_name: EastmarkHK-Snowball
  install_certificate: false
  store: false

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/logo_full.png
    - assets/splash_mobile.png
    - assets/splash_desktop.png

# Native launch must match the Flutter splash (splash_mobile / splash_desktop).
# Do not put logo_full.png here — that showed an icon-only screen before the
# real artwork. iPhone/iPad images are set in LaunchImage.imageset.
flutter_native_splash:
  color: "#0B6E4F"
  background_image: assets/splash_mobile.png
  ios_content_mode: scaleAspectFill
  android_gravity: fill
  fullscreen: true
  android_12:
    image: assets/logo_full.png
    icon_background_color: "#0B6E4F"
    color: "#0B6E4F"
  web: false
